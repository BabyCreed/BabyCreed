<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="BabyCreed: bat signal over Gotham">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.6" stop-color="#0d1018"/>
      <stop offset="1" stop-color="#1a1d26"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFD60A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE76A"/>
      <stop offset="0.75" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0"/>
    </radialGradient>
    <symbol id="bat" viewBox="0 0 100 42">
      <path d="M50 16 L46 5 L44 15 C36 16 30 10 32 2 C14 6 2 16 2 28 C8 22 16 22 20 28 C24 22 32 22 34 30 C40 26 46 30 50 41 C54 30 60 26 66 30 C68 22 76 22 80 28 C84 22 92 22 98 28 C98 16 86 6 68 2 C70 10 64 16 56 15 L54 5 Z"/>
    </symbol>
    <style>
      .beam  { animation: flicker 6s ease-in-out infinite; transform-origin: 760px 320px; }
      .signal{ animation: pulse 6s ease-in-out infinite; }
      .win   { animation: blink 4s steps(1) infinite; }
      .w2 { animation-delay: 1.3s } .w3 { animation-delay: 2.1s } .w4 { animation-delay: 3.4s }
      .star  { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: 1s } .s3 { animation-delay: 2s }
      .title { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 10px; }
      .sub   { font: 500 18px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 4px; }
      @keyframes flicker { 0%,100%{opacity:1; transform:rotate(0deg)} 45%{opacity:.85; transform:rotate(-2deg)} 50%{opacity:.6} 55%{opacity:.9; transform:rotate(1.5deg)} }
      @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.75} }
      @keyframes blink   { 0%,100%{opacity:.9} 50%{opacity:.15} }
      @keyframes twinkle { 0%,100%{opacity:.9} 50%{opacity:.2} }
    </style>
  </defs>

  <rect width="1000" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="star" cx="80" cy="40" r="1.2"/><circle class="star s2" cx="190" cy="90" r="1"/>
    <circle class="star s3" cx="320" cy="30" r="1.4"/><circle class="star" cx="430" cy="70" r="1"/>
    <circle class="star s2" cx="560" cy="25" r="1.2"/><circle class="star s3" cx="920" cy="50" r="1"/>
    <circle class="star" cx="980" cy="120" r="1.1"/><circle class="star s3" cx="30" cy="140" r="1"/>
  </g>

  <!-- bat signal beam + projected emblem -->
  <polygon class="beam" points="745,320 775,320 870,95 650,95" fill="url(#beam)"/>
  <g class="signal">
    <ellipse cx="760" cy="95" rx="112" ry="62" fill="url(#glow)"/>
    <ellipse cx="760" cy="95" rx="98" ry="54" fill="none" stroke="#0a0a0a" stroke-width="4"/>
    <use href="#bat" x="680" y="62" width="160" height="67" fill="#0a0a0a"/>
  </g>

  <!-- Gotham skyline -->
  <g fill="#07080c">
    <path d="M0 320 V250 H40 V220 H70 V250 H95 V200 H120 V180 H130 V200 H150 V320 Z"/>
    <path d="M150 320 V235 H190 V160 L210 140 L230 160 V320 Z"/>
    <path d="M230 320 V210 H280 V190 H300 V320 Z"/>
    <path d="M300 320 V170 H320 V120 H330 V170 H350 V320 Z"/>
    <path d="M350 320 V230 H410 V200 H440 V320 Z"/>
    <path d="M440 320 V185 L470 160 L500 185 V320 Z"/>
    <path d="M500 320 V240 H560 V210 H590 V320 Z"/>
    <path d="M590 320 V150 H610 V110 H620 V150 H640 V320 Z"/>
    <path d="M640 320 V220 H700 V320 Z"/>
    <path d="M700 320 V260 H740 V240 H790 V320 Z"/>
    <path d="M790 320 V195 H830 V170 H850 V320 Z"/>
    <path d="M850 320 V230 H900 V180 L920 165 L940 180 V320 Z"/>
    <path d="M940 320 V215 H1000 V320 Z"/>
  </g>
  <g fill="#FFD60A">
    <rect class="win" x="105" y="215" width="5" height="7"/><rect class="win w2" x="200" y="180" width="5" height="7"/>
    <rect class="win w3" x="315" y="190" width="5" height="7"/><rect class="win w4" x="460" y="210" width="5" height="7"/>
    <rect class="win w2" x="605" y="170" width="5" height="7"/><rect class="win" x="605" y="230" width="5" height="7"/>
    <rect class="win w3" x="815" y="215" width="5" height="7"/><rect class="win w4" x="915" y="200" width="5" height="7"/>
    <rect class="win" x="260" y="230" width="5" height="7"/><rect class="win w4" x="380" y="250" width="5" height="7"/>
  </g>

  <!-- name -->
  <text class="title" x="60" y="130" fill="#F5F5F5">BABY<tspan fill="#FFD60A">CREED</tspan></text>
  <text class="sub" x="64" y="168" fill="#9aa0ad">BUILDING IN THE DARK · SHIPPING IN THE LIGHT</text>
</svg>
