<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Bats flying over the city">
  <defs>
    <symbol id="b" viewBox="0 0 100 42">
      <path d="M50 16 L46 5 L44 15 C36 16 30 10 32 2 C14 6 2 16 2 28 C8 22 16 22 20 28 C24 22 32 22 34 30 C40 26 46 30 50 41 C54 30 60 26 66 30 C68 22 76 22 80 28 C84 22 92 22 98 28 C98 16 86 6 68 2 C70 10 64 16 56 15 L54 5 Z"/>
    </symbol>
    <style>
      .f  { animation: fly 14s linear infinite; }
      .f2 { animation-duration: 18s; animation-delay: -6s; }
      .f3 { animation-duration: 11s; animation-delay: -3s; }
      .q  { font: italic 500 16px Georgia, 'Times New Roman', serif; }
      @keyframes fly { from { transform: translate(-120px, 0) } 50% { transform: translate(500px, -14px) } to { transform: translate(1120px, 0) } }
    </style>
  </defs>
  <rect width="1000" height="120" fill="#05060a"/>
  <g fill="#FFD60A" opacity="0.85">
    <use class="f"    href="#b" x="0" y="20" width="36" height="15"/>
    <use class="f f2" href="#b" x="0" y="45" width="24" height="10"/>
    <use class="f f3" href="#b" x="0" y="10" width="18" height="8"/>
  </g>
  <text class="q" x="500" y="88" text-anchor="middle" fill="#9aa0ad">“It's not who I am underneath, but what I commit that defines me.”</text>
  <rect y="116" width="1000" height="4" fill="#FFD60A"/>
</svg>
